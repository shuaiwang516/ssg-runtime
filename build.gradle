import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    id "com.diffplug.spotless" version "6.6.1"
}

group 'org.zlab'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    jcenter()
    maven { url "https://artifactory.cronapp.io/public-release/" }
}

dependencies {
//    implementation 'com.github.javaparser:javaparser-core:3.25.2'
//    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.23.0' // replace with the current version
    implementation 'com.fasterxml.jackson.core:jackson-core:2.12.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.3'
    implementation 'info.picocli:picocli:4.6.1'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.google.code.gson:gson-extras:2.8.5'
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    implementation 'org.jgrapht:jgrapht-core:1.4.0' // Use the latest version
    implementation 'org.apache.datasketches:datasketches-java:2.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    implementation 'org.apache.commons:commons-text:1.9'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('ocov-shadow')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()

//    include 'org/zlab/dinv/runtimechecker/Runtime*'
//    include 'org/zlab/dinv/runtimechecker/Quant*'

    // Dependencies to include in the shadow jar
//    include 'com/google/gson/**'  // Corrected to include all Gson classes

    include 'org/zlab/ocov/tracker/**'
    include 'org/zlab/ocov/tracker/type/**'
    include 'org/zlab/ocov/**'
}

// Defining a custom shadowJar task
task fatJar(type: ShadowJar) {
    archiveBaseName.set('ssgFatJar')
    archiveClassifier.set('')
    archiveVersion.set('')

    from sourceSets.main.output // Adjust if using a different source set

    configurations = [project.configurations.runtimeClasspath]

    // Create a new configuration that excludes the unwanted library
    // configurations = [project.configurations.runtimeClasspath.copy().exclude(group: 'com.google.guava', module: 'guava')]

    // Include or exclude specific packages as needed
    exclude 'com/google/common/**'
    exclude 'com/google/gson/**'
    // exclude junit
    exclude 'junit/**'
    exclude 'org/junit/**'
    exclude 'org/hamcrest/**' // Hamcrest often comes with JUnit
    // Uncomment this for old version hadoop (3.3.0/3.4.0_15624)
    // exclude 'com/fasterxml/**'
}

application {
    mainClassName = 'org.zlab.dinv.visibility.Main'
}

test {
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed", "standardOut", "standardError"
    }
}

// Phase 2 Apr16 replay. Opt-in only — the default `test` task leaves
// `Apr16FlowReplayTest` inert because the raw Apr16 logs can exceed
// the default Gradle test worker heap on pathological hosts. Run
// explicitly via `./gradlew apr16FlowReplay`; the task bumps JVM heap
// to 2 GiB and sets `replay.apr16=true` so the test actually walks
// the dataset. Override `replay.apr16.root` / `replay.apr16.out`
// (also honored by the test) to point at a different dataset or
// output directory.
task apr16FlowReplay(type: Test) {
    description = 'Phase 2: replay the Apr16 server-log dumps through TraceFlowExtractor.'
    group = 'verification'
    useJUnitPlatform()
    include '**/Apr16FlowReplayTest.class'
    systemProperty 'replay.apr16', 'true'
    if (project.hasProperty('replayApr16Root')) {
        systemProperty 'replay.apr16.root', project.property('replayApr16Root')
    }
    if (project.hasProperty('replayApr16Out')) {
        systemProperty 'replay.apr16.out', project.property('replayApr16Out')
    }
    maxHeapSize = '2g'
    jvmArgs '-XX:+HeapDumpOnOutOfMemoryError'
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'standardOut', 'standardError'
    }
    // Always run fresh — the replay reads external data the build system
    // cannot track.
    outputs.upToDateWhen { false }
}

spotless {
    java {
        target("src/**/*.java") // apply formatting to all .java files under 'src' directory
//        googleJavaFormat() // for example, use the Google Java format
        eclipse().configFile '.settings/eclipse-java-google-style.xml'
    }
}
